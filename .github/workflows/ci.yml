# ═══════════════════════════════════════════════════════════════════
# BONUS — CI/CD với GitHub Actions
#
# Mỗi lần push: máy sạch của GitHub checkout code → chạy test → build và
# đẩy image lên GHCR → và CHỈ khi mọi thứ xanh mới deploy.
#
# Kiểm tra cục bộ: pytest tests/test_bonus_cicd.py -v
# ═══════════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "utils/**"
      - "Dockerfile"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "utils/**"
      - "Dockerfile"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".github/workflows/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 1. Test trên môi trường sạch ─────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Ghim phiên bản (@v5, không phải @main): dùng @main nghĩa là mỗi lần
      # chạy bạn thực thi phiên bản mới nhất của code người khác.
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Loại test_cp5.py (gọi vào bản deploy đang sống → luôn đỏ trong CI) và
      # test_bonus_cicd.py (kiểm tra badge của chính workflow này → tự tham
      # chiếu vòng tròn). `-m "not docker"` bỏ các test build image, đã có
      # job `build` lo phần đó.
      - name: Chạy pytest
        env:
          # Settings bắt buộc có API_TOKEN mà runner không có .env
          API_TOKEN: ci-fake-token
          REDIS_URL: "fake://"
        run: pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"

  # ─── 2. Build image và đẩy lên GHCR ───────────────────────────────
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Chỉ đăng nhập/đẩy khi push lên main. Pull request từ fork không có
      # quyền ghi package, và ta cũng không muốn PR tạo ra image `latest`.
      - name: Đăng nhập GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag và label cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Trên pull request thì chỉ build để chứng minh Dockerfile không hỏng
      # (push: false). Bắt được lỗi kiểu ".dockerignore loại nhầm file cần"
      # ngay tại đây, thay vì lúc deploy.
      - name: Build và push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploy — chỉ khi test và build đều xanh ───────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/labs/day12
            docker compose pull
            docker compose --env-file .env up -d
            docker image prune -f
