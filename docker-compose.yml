# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: chat + redis + nginx (load balancer)
#
#     cp .env.example .env          # đặt API_TOKEN của riêng bạn trước
#     docker compose up -d          # cả stack
#     docker compose up -d redis    # chỉ Redis, để code ở máy
#
# Truy cập: http://localhost:8000 (trực tiếp) hoặc http://localhost:8080 (qua Nginx)
#
# Muốn scale nhiều instance thì bỏ mục `ports` của service `chat` trước (nhiều
# container không dùng chung được một cổng host), rồi vào qua Nginx:
#     docker compose up -d --scale chat=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Nội suy từ file .env cùng thư mục — secret không nằm trong file này,
      # vốn được commit lên git.
      API_TOKEN: ${API_TOKEN}
      # Trong compose, tên service chính là hostname. `localhost` bên trong
      # container là chính container đó, không phải Redis.
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      BUCKET_CAPACITY: ${BUCKET_CAPACITY:-10}
      REFILL_PER_MINUTE: ${REFILL_PER_MINUTE:-10}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ĐIỂM CỘNG — load balancer. `docker compose up --scale chat=3` tạo 3
  # container cùng tên service; Docker DNS trả cả 3 IP cho hostname `chat`
  # và Nginx round-robin giữa chúng.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat
    restart: unless-stopped

volumes:
  redis-data:
